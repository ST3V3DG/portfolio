<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Steve.D</title>
  <link rel="stylesheet" href="/offline.css">
  <script defer src="/offline.js"></script>
</head>
<body>
  <main class="grid h-screen place-content-center px-6 text-center">
    <div class="text-9xl">📡</div>
    <h1 id="heading" class="text-2xl md:text-4xl text-accent font-medium font-clash-display">You're Offline</h1>
    <p id="paragraph" class="text-gray-400 capitalize max-w-md text-lg">It looks like you've lost your internet connection. Some features may not be available.</p>
    <a id="home-link" href="/" class="bg-accent text-background px-6 h-10 text-base py-2 mt-4 rounded-xs font-medium no-underline hover:opacity-90 transition-opacity duration-200 w-fit mx-auto">Go Back Home</a>
  </main>

  <!-- Lang Switcher Dropdown -->
  <div class="fixed right-4 bottom-4 z-10 w-12 h-36 overflow-hidden">
    <div class="relative h-full">
      <button id="lang-menu-toggle" class="absolute bottom-0 left-0 w-full font-clash-display text-xs rounded-none z-10 h-1/3 bg-accent hover:bg-accent/80 transition duration-300 uppercase border-0">
        EN
      </button>
      <div id="lang-menu" class="flex flex-col h-24 translate-y-full transition duration-300 opacity-0">
        <a id="lang-link-1" href="/en" class="border border-b-0 hover:bg-accent/80 rounded-none h-1/2 uppercase flex items-center justify-center">EN</a>
        <a id="lang-link-2" href="/fr" class="border hover:bg-accent/80 rounded-none h-1/2 uppercase flex items-center justify-center">FR</a>
      </div>
    </div>
  </div>
</body>
</html>
